<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VScale Offline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0f6970">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Share+Tech+Mono&display=swap">
<style>
/* Layout: phone app — sticky header, one scrolling column, fixed bottom tab bar; the scale's LCD readout leads the home view. */
:root{
  --bg:#edf1f2; --surface:#ffffff; --ink:#16232a; --muted:#5a6b73; --line:#d2dadd;
  --accent:#0f6970; --accent-ink:#ffffff; --accent-soft:#dcecec;
  --lcd-bg:#14211f; --lcd-ink:#d6f4ee; --lcd-dim:#6f948d;
  --ok:#2c7a4b; --warn:#a8650c; --bad:#b33a3a; --shade:rgba(10,20,24,.45);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --f-lcd:"Share Tech Mono","IBM Plex Mono",ui-monospace,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1417; --surface:#162026; --ink:#e2eaed; --muted:#93a4ab; --line:#27353b;
  --accent:#4fb0b5; --accent-ink:#06191b; --accent-soft:#1c3336;
  --lcd-bg:#071110; --lcd-ink:#c9f2ea; --lcd-dim:#5d8580;
  --ok:#5fbf86; --warn:#e0a24a; --bad:#e57373; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1417; --surface:#162026; --ink:#e2eaed; --muted:#93a4ab; --line:#27353b;
  --accent:#4fb0b5; --accent-ink:#06191b; --accent-soft:#1c3336;
  --lcd-bg:#071110; --lcd-ink:#c9f2ea; --lcd-dim:#5d8580;
  --ok:#5fbf86; --warn:#e0a24a; --bad:#e57373; --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
h1{font-size:17px} h2{font-size:16px} h3{font-size:14px}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.mono{font-family:var(--f-mono);font-size:13px}
.num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top select{width:auto;max-width:48vw;padding:6px 8px;font-size:14px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-left:auto}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--ok)} .dot.busy{background:var(--warn)}
main{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(90px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
section.view{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:440px){.grid2,.grid3{grid-template-columns:1fr}}
/* LCD */
.lcd{background:var(--lcd-bg);color:var(--lcd-ink);border-radius:14px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:8px}
.lcd .big{font-family:var(--f-lcd);font-size:58px;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:8px}
.lcd .big small{font-size:18px;color:var(--lcd-dim)}
.lcd .r{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--f-lcd);font-size:15px;color:var(--lcd-dim)}
.lcd .r b{color:var(--lcd-ink);font-weight:400}
.lcd .msg{font:13px/1.4 var(--f-ui);color:var(--lcd-dim)}
.lcd .msg.err{color:#f2a3a3}
/* controls */
button{font:inherit}
.b{font:500 14px var(--f-ui);border-radius:8px;padding:9px 13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.b.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.b.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
.b.danger{color:var(--bad)}
.b.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.b.sm{padding:6px 10px;font-size:13px}
.b:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{font:15px var(--f-ui);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);padding:0;flex:none}
input[type=color]{padding:2px;height:34px;width:46px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 13px var(--f-ui);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:5px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.tag{display:inline-block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;border-radius:99px;padding:1px 8px;border:1px solid currentColor;color:var(--muted);white-space:nowrap}
.tag.low{color:var(--warn)} .tag.normal{color:var(--ok)} .tag.high{color:var(--bad)}
/* metric tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:3px;text-align:left;color:inherit;cursor:pointer;min-width:0}
.tile .n{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.tile .v{font-family:var(--f-mono);font-size:19px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:12px;color:var(--muted);margin-left:3px}
.tile .d{font-size:12px;font-family:var(--f-mono);color:var(--muted)}
.gauge{position:relative;height:6px;border-radius:3px;background:var(--line);margin-top:4px}
.gauge .ok{position:absolute;top:0;bottom:0;background:var(--ok);opacity:.45;border-radius:3px}
.gauge .mk{position:absolute;top:-3px;width:3px;height:12px;background:var(--ink);border-radius:2px;transform:translateX(-50%)}
/* lists */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;text-align:left;width:100%;cursor:pointer}
.li:first-child{border-top:0}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:14px}
.kv .k{color:var(--muted)}
.kv .v{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
details.m{border-top:1px solid var(--line)}
details.m:first-of-type{border-top:0}
details.m>summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) auto 14px;gap:10px;align-items:center;padding:9px 0;cursor:pointer}
details.m>summary::-webkit-details-marker{display:none}
details.m>summary::after{content:"+";color:var(--muted);font-family:var(--f-mono);text-align:right}
details.m[open]>summary::after{content:"−"}
.mname{display:flex;flex-direction:column;min-width:0}
.mname .src{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.mval{font-family:var(--f-mono);font-size:15px;text-align:right;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.mval small{color:var(--muted);font-size:12px}
.how{padding:0 0 12px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.eq{font-family:var(--f-mono);font-size:12.5px;background:var(--bg);border-radius:6px;padding:8px 10px;overflow-x:auto;white-space:pre;margin:0}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.sec>summary{list-style:none;padding:13px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"›";color:var(--muted);transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(90deg)}
details.sec>.body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
/* tables */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12px;position:sticky;top:0;background:var(--surface)}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tr.sel td{background:var(--accent-soft)}
tbody tr{cursor:pointer}
/* charts */
.chart{display:flex;flex-direction:column;gap:4px}
.chart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.chart .cap{display:flex;justify-content:space-between;gap:8px;font-size:13px;flex-wrap:wrap}
.chart .tip{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-height:1.4em}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:90px}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:11px;color:var(--muted)}
.bars span.bar{width:100%;border-radius:4px 4px 0 0;background:var(--accent);opacity:.75}
.notice{font-size:13px;border-left:3px solid var(--warn);padding:8px 12px;background:var(--bg);border-radius:0 6px 6px 0}
.notice.info{border-left-color:var(--accent)}
pre.log{font:12px/1.45 var(--f-mono);background:var(--bg);border-radius:6px;padding:10px;max-height:240px;overflow:auto;margin:0;white-space:pre-wrap;word-break:break-all}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{border:0;background:transparent;color:var(--muted);font:500 11.5px var(--f-ui);padding:8px 2px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
/* modal */
.modal{position:fixed;inset:0;z-index:20;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.sheet{background:var(--bg);width:100%;max-width:760px;max-height:100%;overflow:auto;border-radius:16px 16px 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .hd{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:14px 6px;z-index:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:22px 8px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top"><div class="in">
  <h1>VScale Offline</h1>
  <select id="userSel" aria-label="Active profile"></select>
  <span class="status"><span class="dot" id="dot"></span><span id="statusText">Not connected</span></span>
</div></header>

<main>
  <section class="view" id="v-home"></section>
  <section class="view" id="v-graph" hidden></section>
  <section class="view" id="v-table" hidden></section>
  <section class="view" id="v-stats" hidden></section>
  <section class="view" id="v-insights" hidden></section>
  <section class="view" id="v-settings" hidden></section>
</main>

<nav class="tabs" aria-label="Sections"><div class="in" role="tablist">
  <button role="tab" data-tab="home" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><rect x="8" y="7" width="8" height="4" rx="1"/><circle cx="9" cy="16" r="1"/><circle cx="15" cy="16" r="1"/></svg>Scale</button>
  <button role="tab" data-tab="graph" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 19h16M5 15l4-5 4 3 6-7"/></svg>Graph</button>
  <button role="tab" data-tab="table" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 10h16M4 14.5h16M10 5v14"/></svg>Table</button>
  <button role="tab" data-tab="stats" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M6 19V11M12 19V5M18 19v-6"/></svg>Stats</button>
  <button role="tab" data-tab="insights" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3zM9.5 19h5M10.5 21.5h3"/></svg>Insights</button>
  <button role="tab" data-tab="settings" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>Settings</button>
</div></nav>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(() => {
'use strict';
// =====================================================================
// Basics
// =====================================================================
const VERSION='0.4';
const SVC='f433bd80-75b8-11e2-97d9-0002a5d5c51b', SVC2='78667579-7b48-43db-b8c5-7928a6b0a335';

const NATIVE=window.AndroidBle||null;
let IN_PREVIEW=false; try{IN_PREVIEW=!NATIVE&&window.top!==window;}catch(e){IN_PREVIEW=!NATIVE;}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hex=b=>Array.from(b,x=>x.toString(16).padStart(2,'0').toUpperCase()).join(' ');
const fromHex=s=>new Uint8Array(String(s).trim().split(/[\s-]+/).filter(Boolean).map(x=>parseInt(x,16)));

const fmtShort=t=>new Date(t).toLocaleDateString([], {day:'numeric',month:'short'});

const WEEKDAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// =====================================================================

// =====================================================================
const BUILTIN=[

  {k:'scaleKcal',n:'Calories (scale)',kind:'kcal',d:0,input:1,on:1,c:'#b08a1e'},
  {k:'bmr',n:'BMR',kind:'kcal',d:0,der:1,on:1,c:'#c99a2e'},
  {k:'tdee',n:'TDEE',kind:'kcal',d:0,der:1,on:0,c:'#d07b2a'},

  {k:'hips',n:'Hips',kind:'len',d:1,input:1,on:0,c:'#5a7f9e'},
  {k:'chest',n:'Chest',kind:'len',d:1,input:1,on:0,c:'#6b6fa8'},
  {k:'thigh',n:'Thigh',kind:'len',d:1,input:1,on:0,c:'#8a6ea0'},
  {k:'biceps',n:'Biceps',kind:'len',d:1,input:1,on:0,c:'#9e6a85'},
  {k:'neck',n:'Neck',kind:'len',d:1,input:1,on:0,c:'#7d7d7d'},
  {k:'whr',n:'Waist-hip ratio',kind:'none',d:2,der:1,on:0,c:'#3e8a86'},
  {k:'whtr',n:'Waist-height ratio',kind:'none',d:2,der:1,on:0,c:'#4a9a6a'},
  {k:'cal1',n:'Caliper 1 (chest / triceps)',kind:'mm',d:1,input:1,on:0,c:'#a07a3c'},

  {k:'imp',n:'Impedance',kind:'ohm',d:0,input:1,on:0,c:'#5a5ac4'},
  {k:'comment',n:'Comment',kind:'text',input:1,on:1,c:'#7d7d7d'}
];
const ACTIVITY=[['Sedentary',1.2],['Light activity',1.375],['Moderate activity',1.55],['Heavy activity',1.725],['Extreme activity',1.9]];
const LIMBS=[['la','Left arm',[['hand','Hand',0.8],['forearm','Forearm',3.0],['arm','Full arm',11.5]]],
             ['ra','Right arm',[['hand','Hand',0.8],['forearm','Forearm',3.0],['arm','Full arm',11.5]]],
             ['ll','Left leg',[['foot','Foot',1.8],['lower','Lower leg',7.1],['leg','Full leg',18.6]]],
             ['rl','Right leg',[['foot','Foot',1.8],['lower','Lower leg',7.1],['leg','Full leg',18.6]]]];
const FAT_F={measured:['Measured (scale or entered)','Uses the body fat value from the scale or your own entry.'],
  deurenberg91:['Deurenberg 1991','Adults, from BMI, age and sex: 1.2·BMI + 0.23·age − 10.8·sex − 5.4 (sex = 1 for men).'],
  deurenberg92:['Deurenberg 1992','Like 1991, with a separate equation for under-16s.'],
  eddy:['Eddy 1976','From BMI and sex only.'],
  gallagherNA:['Gallagher 2000 (non-Asian)','From BMI and age; derived from DEXA data.'],
  gallagherA:['Gallagher 2000 (Asian)','Gallagher equation calibrated for Asian adults.'],
  navy:['US Navy (tape measure)','Uses waist, neck and (women) hips measurements with height. Enter those types.'],
  caliper:['Skinfold caliper (Jackson–Pollock 3)','Uses the three caliper measurements and age.']};
const WATER_F={measured:['Measured (scale or entered)','Uses the water value from the scale or your own entry.'],
  behnke:['Behnke 1963','Total body water from height and sex.'],
  delwaide:['Delwaide–Crenier 1973','Total body water from weight.'],
  humeWeyers:['Hume–Weyers 1971','Total body water from height, weight and sex.'],
  leeSongKim:['Lee–Song–Kim 2001','Total body water from height, weight and sex.']};
const LBM_F={wmf:['Weight minus body fat','Lean mass = weight × (1 − body fat ÷ 100).'],
  boer:['Boer 1984','From weight, height and sex.'],
  hume:['Hume 1966','From weight, height and sex.']};

// =====================================================================
// State
// =====================================================================
function blankUser(name){return {id:uid('u'),name:name||'Me',sex:0,birth:'1990-01-01',height:175,slot:1,activity:1,goals:[],amp:{}};}
function defaultSettings(){return {
  write:'response',muscleUnit:'pct',units:{weight:'kg',length:'cm'},
  formulas:{fat:'measured',water:'measured',lbm:'wmf'},
  types:Object.fromEntries(BUILTIN.map(t=>[t.k,{on:!!t.on,c:t.c}])),custom:[],
  chart:{points:true,goals:true,smoothing:'none',window:5,alpha:0.3,maxGap:30,projection:false,projBasis:60,projDays:30,projDegree:1},
  reminder:{on:false,time:'07:30',days:[1,2,3,4,5,6,7],text:'Time to weigh yourself'},
  backup:{on:false,folder:'',mode:'overwrite'},
  smartAssign:false,haptics:true,theme:'system'};}
function defaults(){const u=blankUser('Me');return {v:2,users:[u],activeId:u.id,ms:[],settings:defaultSettings(),ui:{range:'90',metrics:['weight','fat'],statRange:'30',insMetric:'weight'}};}

function decodeRaw(raw){const f=parseFrame(fromHex(raw));if(f.weightOnly||f.failed)return {weight:f.w};
  return {weight:f.w,fat:f.fat,water:f.water,bone:f.bone,muscle:f.muscle,visc:f.visc,scaleKcal:f.kcal};}
function migrate(old){
  const S=defaults();S.users=[];S.ms=[];
  (old.profiles||[]).forEach(p=>S.users.push({id:p.id,name:p.name,sex:+p.sex||0,birth:p.birth||'1990-01-01',height:+p.height||175,slot:+p.slot||1,activity:1,goals:[],amp:{}}));
  if(!S.users.length)S.users.push(blankUser('Me'));
  S.activeId=old.activeId&&S.users.some(u=>u.id===old.activeId)?old.activeId:S.users[0].id;
  (old.measurements||[]).forEach(m=>S.ms.push({id:m.id,userId:m.profileId,t:new Date(m.t).toISOString(),raw:m.raw,v:decodeRaw(m.raw),src:'scale',sample:!!m.sample}));
  if(old.settings){S.settings.write=old.settings.write||'response';S.settings.muscleUnit=old.settings.muscle==='kg'?'kg':'pct';}
  return S;
}
function fill(S){ // make older or partial states complete
  const d=defaults();S.settings=Object.assign(d.settings,S.settings||{});
  for(const k of ['units','formulas','chart','reminder','backup'])S.settings[k]=Object.assign(defaultSettings()[k],S.settings[k]||{});
  const dt=defaultSettings().types;S.settings.types=Object.assign(dt,S.settings.types||{});
  S.settings.custom=S.settings.custom||[];S.ui=Object.assign(d.ui,S.ui||{});S.ms=S.ms||[];
  S.users.forEach(u=>{u.goals=u.goals||[];u.amp=u.amp||{};if(u.activity==null)u.activity=1;});
  return S;
}
let S;
function load(){
  try{const s=localStorage.getItem(KEY);if(s){S=fill(JSON.parse(s));return;}}catch(e){}
  try{const o=localStorage.getItem(KEY_OLD);if(o){S=fill(migrate(JSON.parse(o)));return;}}catch(e){}
  S=defaults();
  if(IN_PREVIEW)addExampleData(true);
}
let backupTimer=null;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(NATIVE&&S.settings.backup.on&&S.settings.backup.folder&&NATIVE.writeBackup){
    clearTimeout(backupTimer);
    backupTimer=setTimeout(()=>{try{const day=new Date().toISOString().slice(0,10);
      const name=S.settings.backup.mode==='overwrite'?'vscale-backup.json':`vscale-backup-${day}.json`;
      NATIVE.writeBackup(name,JSON.stringify(S),true);}catch(e){}},4000);
  }
}

// ---------- types helpers ----------
function allTypes(){return BUILTIN.concat(S.settings.custom.map(c=>({k:c.k,n:c.n,kind:'custom',unit:c.unit,d:+c.d||1,input:1,custom:1,c:'#6b6b6b'})));}
const typeOf=k=>allTypes().find(t=>t.k===k);
const isOn=k=>!!(S.settings.types[k]&&S.settings.types[k].on);
const colorOf=k=>(S.settings.types[k]&&S.settings.types[k].c)||(typeOf(k)||{}).c||'#0f6970';
const enabledTypes=()=>allTypes().filter(t=>isOn(t.k));
const numericEnabled=()=>enabledTypes().filter(t=>t.kind!=='text');

// ---------- units ----------
function unitOf(t){
  const U=S.settings.units;
  switch(t.kind){
    case 'mass':return U.weight; case 'len':return U.length==='in'?'in':'cm'; case 'mm':return 'mm';
    case 'pct':return '%'; case 'kcal':return 'kcal'; case 'bpm':return 'bpm'; case 'ohm':return 'Ω';
    case 'muscle':return S.settings.muscleUnit==='kg'?U.weight:'%'; case 'custom':return t.unit||''; default:return '';
  }
}
function toDisp(t,v){ if(v==null)return null;
  const U=S.settings.units; const mass=t.kind==='mass'||(t.kind==='muscle'&&S.settings.muscleUnit==='kg');
  if(mass){if(U.weight==='lb')return v*2.2046226;if(U.weight==='st')return v/6.3502932;return v;}
  if(t.kind==='len'&&U.length==='in')return v/2.54;
  return v;}
function fromDisp(t,v){ if(v==null||v==='')return null; v=+v; if(!isFinite(v))return null;
  const U=S.settings.units; const mass=t.kind==='mass'||(t.kind==='muscle'&&S.settings.muscleUnit==='kg');
  if(mass){if(U.weight==='lb')return v/2.2046226;if(U.weight==='st')return v*6.3502932;return v;}
  if(t.kind==='len'&&U.length==='in')return v*2.54;
  return v;}
const show=(t,v)=>fx(toDisp(t,v),t.d==null?1:t.d);
const massU=()=>S.settings.units.weight;
const showMass=v=>f1(toDisp({kind:'mass'},v))+' '+massU();

// ---------- users ----------
const userById=id=>S.users.find(u=>u.id===id);
const active=()=>userById(S.activeId)||S.users[0];
function ageOn(birth,date){const b=new Date(birth),d=date?new Date(date):new Date();if(isNaN(b))return 30;
  let a=d.getFullYear()-b.getFullYear();if(d.getMonth()<b.getMonth()||(d.getMonth()===b.getMonth()&&d.getDate()<b.getDate()))a--;return Math.max(0,a);}
const ampSum=u=>Object.entries(u.amp||{}).reduce((s,[limb,part])=>{const L=LIMBS.find(x=>x[0]===limb);const p=L&&L[2].find(x=>x[0]===part);return s+(p?p[2]:0);},0);
const userMs=(u,from,to)=>S.ms.filter(m=>m.userId===u.id&&(!from||new Date(m.t)>=from)&&(!to||new Date(m.t)<=to)).sort((a,b)=>a.t<b.t?-1:1);

// =====================================================================
// Protocol
// =====================================================================
function parseFrame(b){
  const u16=i=>(b[i]<<8)|b[i+1];
  const f={slot:b[0],sex:b[1],age:b[2],height:b[3],w:u16(4)/10,fat:u16(6)/10,water:u16(8)/10,bone:u16(10)/10,muscle:u16(12)/10,visc:b[14],kcal:u16(15),bmi:u16(17)/10,b19:b[19]};
  f.weightOnly=u16(6)===0xFFFF||b[6]===0xFF;
  f.failed=!f.weightOnly&&u16(6)===0&&u16(8)===0;
  return f;
}
const FIELDS=[[0,1,'User slot',f=>f.slot],[1,1,'Sex',f=>f.sex===0?'male (0)':f.sex===1?'female (1)':f.sex],[2,1,'Age',f=>f.age+' y'],[3,1,'Height',f=>f.height+' cm'],
  [4,2,'Weight',f=>f1(f.w)+' kg'],[6,2,'Body fat',f=>f.weightOnly?'FF FF = no skin contact':f1(f.fat)+' %'],[8,2,'Water',f=>f1(f.water)+' %'],[10,2,'Bone',f=>f1(f.bone)+' kg'],
  [12,2,'Muscle',f=>f1(f.muscle)],[14,1,'Visceral fat',f=>f.visc],[15,2,'Calories',f=>f.kcal+' kcal'],[17,2,'BMI',f=>f1(f.bmi)],[19,1,'Unused',f=>f.b19]];
const kcalFactor=(male,age)=>male?(age<30?24.0:age<50?22.3:21.5):(age<30?22.1:age<50?21.7:20.7);

// =====================================================================
// Calculations: every derived value carries its formula with the numbers
// =====================================================================
function compute(m,u){
  const R={},v=m.v||{},age=ageOn(u.birth,m.t),H=+u.height,h=H/100,male=u.sex==0,F=S.settings.formulas;
  const set=(k,val,eq,note,src)=>{if(val!=null&&isFinite(val))R[k]={v:val,eq,note,src:src||'calc'};};
  const given=(k,note)=>{if(v[k]!=null&&v[k]!==''&&isFinite(+v[k]))set(k,+v[k],null,note,m.raw?'scale':'entered');};
  // weight + amputation correction
  let w=v.weight!=null?+v.weight:null;
  if(w!=null){const a=ampSum(u);
    if(a>0){const wc=w*100/(100-a);set('weight',wc,`corrected weight = measured × 100 ÷ (100 − ${f1(a)})\n                 = ${f1(w)} × 100 ÷ ${f1(100-a)}\n                 = ${f2(wc)} kg`,'Amputation correction from the profile. All results use the corrected weight.','calc');w=wc;}
    else set('weight',w,null,m.raw?'Measured by the scale, bytes 4–5 of the result packet (value ÷ 10).':'Entered by hand.',m.raw?'scale':'entered');}
  const bmi=(w!=null&&H)?w/(h*h):null;
  if(bmi!=null)set('bmi',bmi,`BMI = weight ÷ height²\n    = ${f1(w)} ÷ ${h.toFixed(2)}²\n    = ${f1(bmi)}`,'Body mass index.');
  // body fat
  const meas=v.fat!=null&&isFinite(+v.fat)?+v.fat:null;
  const inch=x=>x/2.54, lg=Math.log10;
  const calFat=(()=>{const c=[v.cal1,v.cal2,v.cal3].map(Number);if(c.some(x=>!isFinite(x)||x<=0)||v.cal1==null||v.cal2==null||v.cal3==null)return null;
    const s=c[0]+c[1]+c[2];const K=male?[1.10938,0.0008267,0.0000016,0.0002574]:[1.0994921,0.0009929,0.0000023,0.0001392];
    const bd=K[0]-K[1]*s+K[2]*s*s-K[3]*age;if(bd<=0)return null;const p=(4.95/bd-4.5)*100;
    return {v:p,eq:`S  = ${c.map(x=>f1(x)).join(' + ')} = ${f1(s)} mm\nBD = ${K[0]} − ${K[1]}·S + ${K[2]}·S² − ${K[3]}·age\n   = ${bd.toFixed(5)}\nfat % = (4.95 ÷ BD − 4.5) × 100 = ${f1(p)} %`};})();
  if(calFat)set('calFat',calFat.v,calFat.eq,'Jackson–Pollock 3-site skinfold equation with the Siri conversion.');
  let fat=null,fatEq=null,fatNote='';
  if(F.fat==='measured'||bmi==null){fat=meas;fatNote=m.raw?'Calculated by the scale from its own impedance reading, sent in bytes 6–7. The scale does not reveal its formula; see Settings › Scale formulas for what the tests recovered.':'Entered by hand.';}
  else{
    const B=f1(bmi),A=age;
    switch(F.fat){
      case 'deurenberg91':fat=1.2*bmi+0.23*age-(male?16.2:5.4);fatEq=`fat % = 1.2·BMI + 0.23·age − ${male?16.2:5.4}\n      = 1.2·${B} + 0.23·${A} − ${male?16.2:5.4}`;break;
      case 'deurenberg92':fat=age>=16?1.2*bmi+0.23*age-10.8*(male?1:0)-5.4:1.294*bmi+0.20*age-11.4*(male?1:0)-8.0;
        fatEq=age>=16?`fat % = 1.2·BMI + 0.23·age − 10.8·${male?1:0} − 5.4\n      = 1.2·${B} + 0.23·${A} − ${male?10.8:0} − 5.4`:`fat % = 1.294·BMI + 0.20·age − 11.4·${male?1:0} − 8.0`;break;
      case 'eddy':fat=male?1.281*bmi-10.13:1.48*bmi-7.0;fatEq=male?`fat % = 1.281·BMI − 10.13\n      = 1.281·${B} − 10.13`:`fat % = 1.48·BMI − 7.0\n      = 1.48·${B} − 7.0`;break;
      case 'gallagherNA':fat=64.5-848/bmi+0.079*age;fatEq=`fat % = 64.5 − 848 ÷ BMI + 0.079·age\n      = 64.5 − 848 ÷ ${B} + 0.079·${A}`;break;
      case 'gallagherA':fat=male?51.9-740/bmi+0.029*age:64.8-752/bmi+0.016*age;fatEq=male?`fat % = 51.9 − 740 ÷ BMI + 0.029·age\n      = 51.9 − 740 ÷ ${B} + 0.029·${A}`:`fat % = 64.8 − 752 ÷ BMI + 0.016·age\n      = 64.8 − 752 ÷ ${B} + 0.016·${A}`;break;
      case 'navy':{const wa=+v.waist,ne=+v.neck,hi=+v.hips,hI=inch(H);
        if(wa>0&&ne>0&&(male?wa>ne:hi>0)){
          if(male){fat=86.010*lg(inch(wa)-inch(ne))-70.041*lg(hI)+36.76;fatEq=`fat % = 86.010·log10(waist − neck) − 70.041·log10(height) + 36.76   (inches)\n      = 86.010·log10(${f1(inch(wa))} − ${f1(inch(ne))}) − 70.041·log10(${f1(hI)}) + 36.76`;}
          else{fat=163.205*lg(inch(wa)+inch(hi)-inch(ne))-97.684*lg(hI)-78.387;fatEq=`fat % = 163.205·log10(waist + hips − neck) − 97.684·log10(height) − 78.387   (inches)\n      = 163.205·log10(${f1(inch(wa))} + ${f1(inch(hi))} − ${f1(inch(ne))}) − 97.684·log10(${f1(hI)}) − 78.387`;}
        }break;}
      case 'caliper':if(calFat){fat=calFat.v;fatEq=calFat.eq;}break;
    }
    if(fat!=null){fat=clamp(fat,1,70);fatEq+=`\n      = ${f1(fat)} %`;fatNote=FAT_F[F.fat][0]+' (chosen in Settings › Formulas). Limited to 1–70 %.';}
    else{fat=meas;fatNote=`${FAT_F[F.fat][0]} needs values this measurement does not have, so the measured value is shown.`;}
  }
  if(fat!=null)set('fat',fat,fatEq,fatNote,fatEq?'calc':(m.raw?'scale':'entered'));
  // water
  const wMeas=v.water!=null&&isFinite(+v.water)?+v.water:null;
  if(F.water==='measured'||w==null){if(wMeas!=null)set('water',wMeas,null,m.raw?'Calculated by the scale, bytes 8–9. Tests show water (kg) ≈ 0.731 × fat-free mass − 2.37.':'Entered by hand.',m.raw?'scale':'entered');}
  else{let L=null,eq='';
    switch(F.water){
      case 'behnke':L=0.72*((male?0.204:0.18)*H*H)/100;eq=`water (L) = 0.72 × ${male?0.204:0.18} × height² ÷ 100\n          = 0.72 × ${male?0.204:0.18} × ${H}² ÷ 100`;break;
      case 'delwaide':L=0.72*(-1.976+0.907*w);eq=`water (L) = 0.72 × (−1.976 + 0.907 × weight)\n          = 0.72 × (−1.976 + 0.907 × ${f1(w)})`;break;
      case 'humeWeyers':L=male?0.194786*H+0.296785*w-14.012934:0.34454*H+0.183809*w-35.270121;eq=male?`water (L) = 0.194786·height + 0.296785·weight − 14.012934`:`water (L) = 0.34454·height + 0.183809·weight − 35.270121`;break;
      case 'leeSongKim':L=male?-28.3497+0.243057*H+0.366248*w:-26.6224+0.262513*H+0.232948*w;eq=male?`water (L) = −28.3497 + 0.243057·height + 0.366248·weight`:`water (L) = −26.6224 + 0.262513·height + 0.232948·weight`;break;
    }
    if(L!=null){L=Math.max(0,L);const p=clamp(L/w*100,0,100);set('water',p,`${eq}\n          = ${f1(L)} L\nwater %   = ${f1(L)} ÷ ${f1(w)} × 100 = ${f1(p)} %`,WATER_F[F.water][0]+' (chosen in Settings › Formulas).');}
  }
  // lean body mass and fat mass
  const fatV=R.fat?R.fat.v:null;
  if(w!=null){let l=null,eq='';
    if(F.lbm==='wmf'){if(fatV!=null){l=w*(1-fatV/100);eq=`LBM = weight × (1 − fat % ÷ 100)\n    = ${f1(w)} × (1 − ${f1(fatV)} ÷ 100)`;}}
    else if(F.lbm==='boer'){l=male?0.4071*w+0.267*H-19.2:0.252*w+0.473*H-48.3;eq=male?`LBM = 0.4071·weight + 0.267·height − 19.2\n    = 0.4071·${f1(w)} + 0.267·${H} − 19.2`:`LBM = 0.252·weight + 0.473·height − 48.3\n    = 0.252·${f1(w)} + 0.473·${H} − 48.3`;}
    else if(F.lbm==='hume'){l=male?0.32810*w+0.33929*H-29.5336:0.29569*w+0.41813*H-43.2933;eq=male?`LBM = 0.32810·weight + 0.33929·height − 29.5336\n    = 0.32810·${f1(w)} + 0.33929·${H} − 29.5336`:`LBM = 0.29569·weight + 0.41813·height − 43.2933\n    = 0.29569·${f1(w)} + 0.41813·${H} − 43.2933`;}
    if(l!=null)set('lbm',Math.max(0,l),eq+`\n    = ${f1(l)} kg`,LBM_F[F.lbm][0]+' (chosen in Settings › Formulas).');
    if(fatV!=null){const fm=w*fatV/100;set('fatMass',fm,`fat mass = weight × fat % ÷ 100\n         = ${f1(w)} × ${f1(fatV)} ÷ 100\n         = ${f1(fm)} kg`);}
  }
  // muscle, bone, visceral, scale calories
  if(v.muscle!=null&&isFinite(+v.muscle)){const mu=+v.muscle;
    set('muscle',mu,S.settings.muscleUnit==='pct'&&w!=null?`muscle mass = weight × muscle % ÷ 100\n            = ${f1(w)} × ${f1(mu)} ÷ 100\n            = ${f1(w*mu/100)} kg`:null,
      m.raw?'Calculated by the scale, bytes 12–13. Whether it is a percentage or kg is set in Settings › Units.':'Entered by hand.',m.raw?'scale':'entered');}
  given('bone',m.raw?'Calculated by the scale, bytes 10–11.':'Entered by hand.');
  given('visc',m.raw?'Visceral fat rating calculated by the scale, byte 14.':'Entered by hand.');
  if(v.scaleKcal!=null&&isFinite(+v.scaleKcal)){const fac=kcalFactor(male,age);
    set('scaleKcal',+v.scaleKcal,`calories = weight × factor for ${male?'men':'women'} aged ${age}\n         = ${f1(v.weight)} × ${fac}\n         = ${Math.round(v.weight*fac)} kcal/day   (stored: ${v.scaleKcal})`,
      m.raw?'Sent by the scale in bytes 15–16. Recovered rule: weight × a basal metabolic factor per age group (men 24.0 under 30, 22.3 at 30–49, 21.5 at 50+). No impedance or height is used.':'Entered by hand.',m.raw?'scale':'entered');}
  // BMR / TDEE
  if(w!=null&&H&&age>0){const bmr=10*w+6.25*H-5*age+(male?5:-161);
    set('bmr',bmr,`BMR = 10·weight + 6.25·height − 5·age ${male?'+ 5':'− 161'}\n    = 10·${f1(w)} + 6.25·${H} − 5·${age} ${male?'+ 5':'− 161'}\n    = ${Math.round(bmr)} kcal/day`,'Mifflin–St Jeor equation (1990), as used by openScale.');
    const A=ACTIVITY[u.activity]||ACTIVITY[1];
    set('tdee',bmr*A[1],`TDEE = BMR × activity factor\n     = ${Math.round(bmr)} × ${A[1]}  (${A[0].toLowerCase()})\n     = ${Math.round(bmr*A[1])} kcal/day`,'Total daily energy use. The activity level is set in the profile.');}
  // tape measurements and ratios
  ['waist','hips','chest','thigh','biceps','neck','cal1','cal2','cal3','hr','imp'].forEach(k=>given(k,'Entered by hand.'));
  if(+v.waist>0&&+v.hips>0)set('whr',v.waist/v.hips,`WHR = waist ÷ hips\n    = ${f1(v.waist)} ÷ ${f1(v.hips)}\n    = ${f2(v.waist/v.hips)}`,'Waist-hip ratio.');
  if(+v.waist>0&&H)set('whtr',v.waist/H,`WHtR = waist ÷ height\n     = ${f1(v.waist)} ÷ ${H}\n     = ${f2(v.waist/H)}`,'Waist-to-height ratio.');
  S.settings.custom.forEach(c=>given(c.k,'Entered by hand.'));
  if(v.comment)R.comment={v:String(v.comment),src:'entered'};
  return R;
}

// Reference ranges (from openScale's evaluation tables)
function band(list,age){return list.find(b=>age>=b[0]&&age<=b[1]);}
const RANGES={
  fat:(age,male)=>band(male?[[10,14,11,16],[15,19,12,17],[20,29,13,18],[30,39,14,19],[40,49,15,20],[50,59,16,21],[60,69,17,22],[70,999,18,23]]:[[10,14,16,21],[15,19,17,22],[20,29,18,23],[30,39,19,24],[40,49,20,25],[50,59,21,26],[60,69,22,27],[70,999,23,28]],age),
  water:(age,male)=>band(male?[[10,999,50,65]]:[[10,999,45,60]],age),

function toCSV(ms){

  const rows=list.map(({m,u,C})=>[localInput(m.t).replace('T',' '),u.name,u.sex==0?'M':'F',ageOn(u.birth,m.t),u.height,...cols.map(t=>C[t.k]?fx(toDisp(t,C[t.k].v),t.d==null?1:t.d):''),C.comment?C.comment.v:'',m.raw?'scale':m.src||'manual',m.raw||''].map(q).join(','));

function toTXT(ms,withFormulas=true){

  ms.forEach((m,i)=>{const u=userById(m.userId)||active(),C=compute(m,u),age=ageOn(u.birth,m.t);
    out.push('='.repeat(58),`${fmtDT(m.t)}   ${u.name} (${u.sex==0?'male':'female'}, ${age} y, ${u.height} cm)`,'-'.repeat(58));
    allTypes().forEach(t=>{const c=C[t.k];if(!c||t.kind==='text')return;const e=evaluate(t.k,c.v,u,m.t);
      out.push(`${(t.n+' ').padEnd(30,'.')} ${(show(t,c.v)+' '+unitOf(t)).padStart(12)}${e?'   '+STATE_TXT[e.state]+' ('+show(t,e.lo)+'–'+show(t,e.hi)+')':''}`);});
    if(C.comment)out.push('',`Comment: ${C.comment.v}`);
    if(withFormulas){const eqs=allTypes().filter(t=>C[t.k]&&C[t.k].eq);if(eqs.length){out.push('','Calculations:');eqs.forEach(t=>{out.push(`  ${t.n}:`);C[t.k].eq.split('\n').forEach(l=>out.push('    '+l));});}}

function parseCSVText(txt){
  const rows=[];let row=[],cell='',q=false;txt=txt.replace(/^﻿/,'');
  const delim=(()=>{const l=txt.split('\n')[0]||'';return (l.match(/;/g)||[]).length>(l.match(/,/g)||[]).length?';':',';})();
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;else if(c===delim){row.push(cell);cell='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}else cell+=c;}
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function parseDateLoose(s){s=String(s).trim();if(!s)return null;

function linreg(xs,ys){const n=xs.length,mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;let sxy=0,sxx=0;xs.forEach((x,i)=>{sxy+=(x-mx)*(ys[i]-my);sxx+=(x-mx)**2;});const b=sxx?sxy/sxx:0;return {b,a:my-b*mx};}

    const msg=plateau>=21?`No significant change for ${plateau} days. Your body may be adapting.`:vol==='high'?'High fluctuation detected. This is common and can reflect natural daily variation in water and food.':vol==='stable'?'Your values are very consistent, which gives a reliable basis.':dir==='Decreasing'?'Recent downward trend.':dir==='Increasing'?'Recent upward trend. Keep an eye on the long-term direction.':'Values are holding steady.';
    h+=`<p class="notice info">${esc(msg)}</p>`;}
  h+=`</div>`;
  // body composition pattern
  h+=`<div class="panel"><h2>Your body composition</h2>`;
  const comp=userMs(u,new Date(Date.now()-90*DAY)).map(m=>{const C=compute(m,u);if(!C.weight||!C.fat||!C.muscle)return null;const w=C.weight.v;
      return {t:new Date(m.t).getTime(),w,fm:C.fatMass?C.fatMass.v:w*C.fat.v/100,mm:S.settings.muscleUnit==='kg'?C.muscle.v:w*C.muscle.v/100};}).filter(Boolean);
  if(comp.length<4)h+=`<p class="small muted">At least 4 measurements in the last 90 days with weight, body fat and muscle are needed. You have ${comp.length}.</p>`;
  else{const xs=comp.map(p=>(p.t-comp[0].t)/DAY);const sl=key=>linreg(xs,comp.map(p=>p[key])).b*30.44;const sw=sl('w'),sf=sl('fm'),smu=sl('mm');const th=0.2;
    const F=sf<-th?-1:sf>th?1:0,M=smu<-th?-1:smu>th?1:0;
    const [lab,txt]=F<0&&M>0?['Recomposition','You are losing fat while gaining muscle, the best possible outcome.']:F>0&&M>0?['Bulking','Both fat and muscle are increasing. If this is not a deliberate bulk, review your diet.']:F<0&&M<0?['Mixed loss','Weight is dropping, but muscle mass is declining too. More protein and strength training help preserve it.']:F>0&&M<=0?['Fat gain','Fat mass is increasing while muscle is stable or falling.']:F<0?['Fat loss','Fat is dropping while muscle mass is being preserved.']:M>0?['Muscle gain','Muscle mass is rising while fat stays stable.']:M<0?['Muscle loss','Muscle mass is falling while fat stays stable.']:['Stable','All metrics are stable: a maintenance phase.'];
    const a=comp[0],z=comp[comp.length-1];
    h+=`<p><span class="tag normal">${lab}</span></p><p class="small">${esc(txt)}</p><div class="scroll"><table><thead><tr><th></th><th class="n">Start</th><th class="n">Now</th><th class="n">Per month</th></tr></thead><tbody>
      <tr><td>Weight</td><td class="n">${showMass(a.w)}</td><td class="n">${showMass(z.w)}</td><td class="n">${(sw>=0?'+':'')+f2(toDisp({kind:'mass'},sw))}</td></tr>
      <tr><td>Fat mass</td><td class="n">${showMass(a.fm)}</td><td class="n">${showMass(z.fm)}</td><td class="n">${(sf>=0?'+':'')+f2(toDisp({kind:'mass'},sf))}</td></tr>
      <tr><td>Muscle mass</td><td class="n">${showMass(a.mm)}</td><td class="n">${showMass(z.mm)}</td><td class="n">${(smu>=0?'+':'')+f2(toDisp({kind:'mass'},smu))}</td></tr></tbody></table></div>
      <p class="tiny muted">Based on ${comp.length} measurements in the last 90 days. Muscle mass uses the scale's muscle value${S.settings.muscleUnit==='pct'?' as a percentage of weight':''}.</p>`;}
  h+=`</div>`;
  // weekday habits
  h+=`<div class="panel"><h2>Your weekly habits</h2>`;
  if(s.length<10)h+=`<p class="small muted">At least 10 measurements are needed to look for weekly patterns.</p>`;
  else{const r=linreg(s.map(p=>p.t/DAY),s.map(p=>p.v));const by=Array.from({length:7},()=>[]);s.forEach(p=>{const wd=(new Date(p.t).getDay()+6)%7;by[wd].push(p.v-(r.a+r.b*p.t/DAY));});
    const days=by.map(a=>a.length>=2?a.reduce((x,y)=>x+y,0)/a.length:null);const valid=days.filter(x=>x!=null).length;
    if(valid<4)h+=`<p class="small muted">Measure on more different weekdays (at least 2 readings on 4 weekdays) to see a pattern.</p>`;
    else{const mxA=Math.max(...days.filter(x=>x!=null).map(Math.abs))||1;const hi=days.indexOf(Math.max(...days.filter(x=>x!=null))),lo=days.indexOf(Math.min(...days.filter(x=>x!=null)));
      h+=`<p class="small">You tend to measure highest on <b>${WEEKDAYS[hi]}</b> and lowest on <b>${WEEKDAYS[lo]}</b>, ${(days[hi]-days[lo]).toFixed(Math.max(d,1))} ${esc(U)} apart after removing the overall trend.</p>
      <div class="bars">${days.map((x,i)=>`<div><span class="tiny mono">${x==null?'':(x>=0?'+':'')+x.toFixed(Math.max(d,1))}</span><span class="bar" style="height:${x==null?0:(8+Math.abs(x)/mxA*62).toFixed(0)}px;${x!=null&&x<0?'opacity:.4':''}"></span>${WEEKDAYS[i]}</div>`).join('')}</div>`;}}
  h+=`</div>`;
  // seasonal
  h+=`<div class="panel"><h2>Your year in review</h2>`;
  const span=s.length?(s[s.length-1].t-s[0].t)/DAY:0;
  if(span<330)h+=`<p class="small muted">About a year of data is needed to detect seasonal patterns. You have ${Math.round(span)} days.</p>`;
  else{const mo=Array.from({length:12},()=>[]);s.forEach(p=>mo[new Date(p.t).getMonth()].push(p.v));const av=mo.map(a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null);const v2=av.filter(x=>x!=null);
    const hi=av.indexOf(Math.max(...v2)),lo=av.indexOf(Math.min(...v2));h+=`<p class="small">Your values tend to peak in <b>${MONTHS[hi]}</b> (${av[hi].toFixed(d)}) and dip in <b>${MONTHS[lo]}</b> (${av[lo].toFixed(d)}).</p>`;}
  h+=`</div>`;
  // anomalies
  h+=`<div class="panel"><h2>Unusual measurements</h2>`;
  if(s.length<10)h+=`<p class="small muted">At least 10 measurements are needed to detect unusual values.</p>`;
  else{const exp=s.map((p,i)=>median(s.slice(Math.max(0,i-3),i).concat(s.slice(i+1,i+4)).map(x=>x.v)));const dev=s.map((p,i)=>p.v-exp[i]);const mad=median(dev.map(Math.abs))||Math.pow(10,-d);
    const lim=Math.max(4*mad,Math.abs(median(s.map(p=>p.v)))*0.015);const an=s.map((p,i)=>({p,e:exp[i],dv:dev[i]})).filter(x=>Math.abs(x.dv)>lim);
    h+=an.length?`<div class="list">${an.slice(-8).reverse().map(x=>`<button class="li" data-act="open" data-id="${esc(x.p.id)}"><span>${esc(fmtDT(x.p.t))}<br><span class="tiny muted">${(x.dv>=0?'+':'')+x.dv.toFixed(Math.max(d,1))} ${esc(U)} from the expected ${x.e.toFixed(d)}</span></span><span class="mono">${x.p.v.toFixed(d)} ${esc(U)}</span></button>`).join('')}</div>`:`<p class="small muted">No unusual measurements detected.</p>`;}
  h+=`</div><p class="tiny muted">Insights are statistical summaries of your own data, not medical advice.</p>`;
  $('v-insights').innerHTML=h;
}

const LOG=[];
function log(dir,ch,data){LOG.push(`${new Date().toLocaleTimeString()} ${dir} ${ch} ${data}`);if(LOG.length>400)LOG.shift();const el=$('log');if(el){el.textContent=LOG.join('\n');el.scrollTop=1e9;}}
let dev=null,cmdCh=null,lastRaw='',lastAt=0,probeWait=null,probeRows=[],btState='off',btText='Not connected',lcdMsg='',lcdErr=false,smartPending=null;
const assist={on:false,carrier:''};
function btHint(){
  if(!navigator.bluetooth&&!NATIVE)return 'Bluetooth is not available in this preview. Install the Android app, or open this page from its own web address in Chrome on Android.';
  return 'Step on the scale barefoot and wait until it shows your weight. Then tap Connect (or Get result when connected). The scale calculates your results from that weigh-in using this profile.';}
function setStatus(state,text){btState=state;btText=text;$('dot').className='dot'+(state==='on'?' on':state==='busy'?' busy':'');$('statusText').textContent=text;
  const c=$('btnConnect'),r=$('btnResend'),d=$('btnDisconnect');if(c){c.disabled=state!=='off';r.disabled=state!=='on';d.disabled=state==='off';}}
function lcd(msg,err,f){lcdMsg=msg;lcdErr=!!err;const el=$('lcdMsg');if(el){el.textContent=msg;el.classList.toggle('err',!!err);}
  if(f&&$('lcdW')){$('lcdW').textContent=show(typeOf('weight'),f.w);const ok=!f.weightOnly&&!f.failed;$('lcdF').textContent=ok?f1(f.fat):'--.-';$('lcdH').textContent=ok?f1(f.water):'--.-';$('lcdB').textContent=f1(f.bmi);}}
function profileBytes(u){u=u||active();return new Uint8Array([0x10,(+u.slot)&0xFF,u.sex==1?1:0,ageOn(u.birth)&0xFF,Math.round(u.height)&0xFF]);}
window.__ble={
  status(state,text){
    if(state==='ready'){cmdCh=true;setStatus('on',text||'Connected');writeCmd(profileBytes()).catch(()=>{});lcd('Profile sent. If no result appears, weigh yourself, then tap Get result.');}
    else{if(state==='off')cmdCh=null;setStatus(state,text);if(state==='off'&&text&&text!=='Disconnected')lcd(text,true);}},
  notify(uuid,h){const b=fromHex(h);if(uuid.toLowerCase().startsWith('1a2ea400'))onFrame(b);else log('←',uuid.slice(0,8),hex(b));},
  error(msg){log('!','native',msg);lcd(msg,true);}
};
window.__native={backupFolder(name){S.settings.backup.folder=name;S.settings.backup.on=true;save();if(TAB==='settings')render();toast('Backup folder set');}};
async function writeCmd(bytes){
  if(NATIVE){log('→',CH_CMD.slice(0,8),hex(bytes));NATIVE.write(hex(bytes),S.settings.write==='response');return;}
  if(!cmdCh)throw new Error('Not connected');log('→',CH_CMD.slice(0,8),hex(bytes));
  const order=S.settings.write==='response'?['writeValueWithResponse','writeValueWithoutResponse']:['writeValueWithoutResponse','writeValueWithResponse'];
  for(const fn of order){try{if(cmdCh[fn]){await cmdCh[fn](bytes);return;}}catch(e){log('!','write',fn+' failed: '+e.message);}}
  await cmdCh.writeValue(bytes);}
async function connect(){
  if(NATIVE){setStatus('busy','Searching…');lcd('Looking for the scale. Step on it if it is asleep.');NATIVE.connect();return;}
  if(!navigator.bluetooth){lcd(btHint(),true);return;}
  try{setStatus('busy','Searching…');
    dev=await navigator.bluetooth.requestDevice({filters:[{services:[SVC]},{name:'VSCALE'},{name:'VScale'},{namePrefix:'VSCALE'}],optionalServices:[SVC,SVC2]});
    dev.addEventListener('gattserverdisconnected',()=>{setStatus('off','Disconnected');cmdCh=null;});
    setStatus('busy','Connecting…');const server=await dev.gatt.connect();const svc=await server.getPrimaryService(SVC);
    const res=await svc.getCharacteristic(CH_RES);res.addEventListener('characteristicvaluechanged',e=>onFrame(new Uint8Array(e.target.value.buffer)));await res.startNotifications();
    try{const aux=await svc.getCharacteristic(CH_AUX);aux.addEventListener('characteristicvaluechanged',e=>log('←',CH_AUX.slice(0,8),hex(new Uint8Array(e.target.value.buffer))));await aux.startNotifications();}catch(e){log('!','aux',e.message);}
    cmdCh=await svc.getCharacteristic(CH_CMD);setStatus('on','Connected to '+(dev.name||'scale'));
    await writeCmd(profileBytes());lcd('Profile sent. If no result appears, weigh yourself, then tap Get result.');
  }catch(e){setStatus('off','Not connected');lcd(e.name==='NotFoundError'?'No scale selected.':'Connection failed: '+e.message+'. Close the bodivis app, wake the scale, and try again.',e.name!=='NotFoundError');}
}
function closestUser(w){let best=null,bd=1e9;S.users.forEach(u=>{const l=lastTwo(u,'weight')[0];if(!l)return;const d=Math.abs(l.m.v.weight-w);if(d<bd){bd=d;best=u;}});return bd<=5?best:null;}
function onFrame(b){
  log('←',CH_RES.slice(0,8),hex(b));if(b.length!==20)return;const f=parseFrame(b);
  if(probeWait){const w=probeWait;probeWait=null;f.raw=hex(b);w(f);return;}
  const u=active(),raw=hex(b),now=Date.now();
  if(assist.on){const c=userById(assist.carrier);const l=c&&lastTwo(c,'weight')[0];
    if(!l){lcd('Choose whose weight to subtract first.',true);return;}
    const net=f.w-l.m.v.weight;if(net<=0){lcd(`Total ${f1(f.w)} kg is not more than ${c.name}'s ${f1(l.m.v.weight)} kg.`,true);return;}
    S.ms.push({id:uid('m'),userId:u.id,t:new Date().toISOString(),v:{weight:net,comment:`Assisted weighing: ${f1(f.w)} kg total − ${f1(l.m.v.weight)} kg (${c.name})`},src:'assisted'});
    assist.on=false;save();buzz();lcd(`Saved ${showMass(net)} for ${u.name} (${f1(f.w)} − ${f1(l.m.v.weight)} kg).`,false,f);render();return;}
  if(f.weightOnly||f.failed){lcd(`Weight ${showMass(f.w)}, but no body composition: the scale got no skin contact (ErrF). Stand barefoot on all four pads, weigh again, then tap Get result.`,true,f);return;}
  if(S.settings.smartAssign&&S.users.length>1&&!smartPending){const best=closestUser(f.w);
    if(best&&best.id!==u.id){smartPending=best.id;S.activeId=best.id;save();render();lcd(`Weight matches ${best.name}. Recalculating for their profile…`);writeCmd(profileBytes(best)).catch(()=>{smartPending=null;});return;}}
  smartPending=null;
  const dup=raw===lastRaw&&now-lastAt<120000;lastRaw=raw;lastAt=now;
  if(dup){lcd('Same result as before (not saved twice).',false,f);return;}
  if(f.age!==ageOn(u.birth)||f.height!==Math.round(u.height))log('!','note','The profile in the packet differs from the active profile.');
  const m={id:uid('m'),userId:u.id,t:new Date().toISOString(),raw,v:decodeRaw(raw),src:'scale'};S.ms.push(m);save();buzz();
  lcd(`Saved for ${u.name}.`,false,f);render();openModal(detailHTML(m));
}
function buzz(){if(!S.settings.haptics)return;try{if(NATIVE&&NATIVE.vibrate)NATIVE.vibrate(120);else if(navigator.vibrate)navigator.vibrate(120);}catch(e){}}
function waitFrame(ms){return new Promise(res=>{probeWait=res;setTimeout(()=>{if(probeWait===res){probeWait=null;res(null);}},ms);});}
function probeTableHTML(){return probeRows.length?`<table><thead><tr><th>Sex</th><th class="n">Age</th><th class="n">Height</th><th class="n">Weight</th><th class="n">Fat %</th><th class="n">Water %</th><th class="n">Bone</th><th class="n">Muscle</th><th class="n">Visc</th><th class="n">kcal</th></tr></thead><tbody>${probeRows.map(r=>`<tr><td>${r.sex?'F':'M'}</td><td class="n">${r.age}</td><td class="n">${r.h}</td>${r.f?`<td class="n">${f1(r.f.w)}</td><td class="n">${f1(r.f.fat)}</td><td class="n">${f1(r.f.water)}</td><td class="n">${f1(r.f.bone)}</td><td class="n">${f1(r.f.muscle)}</td><td class="n">${r.f.visc}</td><td class="n">${r.f.kcal}</td>`:'<td colspan="7" class="muted">no reply</td>'}</tr>`).join('')}</tbody></table>`:'';}
async function runProbe(){
  const u=active(),a=ageOn(u.birth),hh=Math.round(u.height),sx=u.sex==1?1:0,L=[[sx,a,hh]];
  [20,30,40,50,60,70].forEach(x=>{if(x!==a)L.push([sx,x,hh]);});[150,160,170,180,190,200].forEach(x=>{if(x!==hh)L.push([sx,a,x]);});L.push([sx?0:1,a,hh]);L.push([sx,a,hh]);
  probeRows=[];for(let i=0;i<L.length;i++){const [s,ag,ht]=L[i];const st=$('probeStatus');if(st)st.textContent=`Sending ${i+1} of ${L.length}…`;
    const wait=waitFrame(4000);try{await writeCmd(new Uint8Array([0x10,u.slot&0xFF,s,ag,ht]));}catch(e){probeWait=null;if(st)st.textContent='Stopped: '+e.message;break;}
    const f=await wait;probeRows.push({sex:s,age:ag,h:ht,f:f&&!f.weightOnly?f:null,raw:f?f.raw:''});const pt=$('probeTable');if(pt)pt.innerHTML=probeTableHTML();await new Promise(r=>setTimeout(r,600));}
  const st=$('probeStatus');if(st)st.textContent=`Done: ${probeRows.filter(r=>r.f).length} of ${L.length} replies. Copy the results and paste them in the chat.`;
  try{await writeCmd(profileBytes());}catch(e){}if(TAB==='settings')render();}
const probeCSV=()=>['sex,age,height_cm,weight_kg,fat_pct,water_pct,bone_kg,muscle,visceral,kcal,bmi,raw',...probeRows.map(r=>r.f?[r.sex,r.age,r.h,f1(r.f.w),f1(r.f.fat),f1(r.f.water),f1(r.f.bone),f1(r.f.muscle),r.f.visc,r.f.kcal,f1(r.f.bmi),r.raw].join(','):[r.sex,r.age,r.h,'no reply'].join(','))].join('\n');

function addExampleData(silent){
  let u=S.users.find(x=>x.example);if(u){S.activeId=u.id;save();if(!silent){render();toast('Example profile already loaded');}return;}
  u={id:uid('u'),name:'Example',example:true,sex:0,birth:'1986-03-14',height:180,slot:2,activity:1,goals:[],amp:{}};
  if(S.users.length===1&&!S.ms.length&&S.users[0].name==='Me'&&silent)S.users=[];
  S.users.push(u);S.activeId=u.id;
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};const gauss=()=>{let s=0;for(let i=0;i<6;i++)s+=rnd();return s-3;};
  const now=Date.now(),start=now-200*DAY;let t=start;let i=0;
  while(t<now){const d=new Date(t);d.setHours(7,10+Math.floor(rnd()*35),0,0);const days=(d-start)/DAY;
    let w=108.6-days*0.021+Math.sin(days/23)*0.5+gauss()*0.35+((d.getDay()===1)?0.6:0);if(i===27)w+=2.4;
    const age=ageOn(u.birth,d),bmi=w/3.24;const fat=-17.0+1.139*bmi+0.0117*bmi*bmi+0.1027*Math.abs(age-30)+gauss()*0.25-days*0.006;
    const ffm=w*(1-fat/100),water=(0.731*ffm-2.37)/w*100,muscle=23.5+(32.6-bmi)*0.85+days*0.004+gauss()*0.2;
    const v={weight:+w.toFixed(1),fat:+fat.toFixed(1),water:+water.toFixed(1),bone:+(3.9+(bmi-32.6)*0.06).toFixed(1),muscle:+muscle.toFixed(1),visc:Math.round(-18.08+0.861*bmi+0.0077*bmi*bmi+0.0726*Math.abs(age-30)),scaleKcal:Math.round(w*kcalFactor(true,age))};
    if(i%7===0){v.waist=+(112-days*0.02+gauss()*0.4).toFixed(1);v.hips=+(108-days*0.012+gauss()*0.3).toFixed(1);v.neck=+(42.5+gauss()*0.2).toFixed(1);}
    if(i===27)v.comment='After a holiday weekend';
    S.ms.push({id:uid('m'),userId:u.id,t:d.toISOString(),v,src:'manual',example:true});
    t+=DAY*(1+Math.floor(rnd()*2.2));i++;}
  u.goals=[{k:'weight',v:98,date:new Date(now+150*DAY).toISOString().slice(0,10),start:108.6},{k:'fat',v:25}];
  S.settings.types.waist.on=true;S.settings.types.whtr.on=true;S.settings.types.fatMass.on=true;
  save();if(!silent){render();toast('Example profile loaded');}
}

function confirmTap(el){const key=el.dataset.act+'|'+(el.dataset.id||el.dataset.k||'');if(armed.get(key)&&Date.now()-armed.get(key)<4000){armed.delete(key);return true;}
  armed.set(key,Date.now());const old=el.textContent;el.textContent=el.dataset.confirm;el.classList.add('armed');setTimeout(()=>{if(el.isConnected&&armed.has(key)){el.textContent=old;el.classList.remove('armed');armed.delete(key);}},4000);return false;}

function setPath(obj,path,val){const p=path.split('.');let o=obj;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val;}
function syncReminder(){if(NATIVE&&NATIVE.setReminder){try{NATIVE.setReminder(JSON.stringify(S.settings.reminder));}catch(e){}}}
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='userSel'){S.activeId=el.value;SEL.clear();save();render();return;}
  if(el.id==='assistOn'){assist.on=el.checked;if(assist.on&&!assist.carrier){const c=S.users.find(x=>x.id!==S.activeId&&lastTwo(x,'weight')[0]);assist.carrier=c?c.id:'';}render();return;}
  if(el.id==='assistCarrier'){assist.carrier=el.value;return;}
  if(el.dataset.sel){if(el.checked)SEL.add(el.dataset.sel);else SEL.delete(el.dataset.sel);render();return;}
  if(el.dataset.ui){S.ui[el.dataset.ui]=el.value;save();render();return;}
  if(el.dataset.user){const u=active(),k=el.dataset.user;let v=el.value;
    if(k==='height'){v=fromDisp({kind:'len'},v);if(v==null||v<50||v>260){toast('Enter a height between 50 and 260 cm');render();return;}v=Math.round(v*10)/10;}
    else if(k==='sex'||k==='activity'||k==='slot')v=clamp(parseInt(v,10)||0,0,k==='activity'?4:k==='slot'?255:1);
    else if(k==='name')v=v.trim()||'Profile';
    u[k]=v;save();render();return;}
  if(el.dataset.amp){const u=active();if(el.value)u.amp[el.dataset.amp]=el.value;else delete u.amp[el.dataset.amp];save();render();return;}
  if(el.dataset.type){S.settings.types[el.dataset.type]=S.settings.types[el.dataset.type]||{c:colorOf(el.dataset.type)};S.settings.types[el.dataset.type].on=el.checked;save();return;}
  if(el.dataset.color){S.settings.types[el.dataset.color].c=el.value;save();return;}
  if(el.dataset.set){const p=el.dataset.set;let v=el.type==='checkbox'?el.checked:el.value;
    if(/^chart\.(window|maxGap|projBasis|projDays|projDegree)$/.test(p))v=Math.max(1,parseInt(v,10)||1);if(p==='chart.alpha')v=clamp(parseFloat(v)||0.3,0.01,1);
    setPath(S.settings,p,v);save();if(p==='theme')setTheme();if(p.startsWith('reminder'))syncReminder();
    if(p==='backup.on'&&v&&!S.settings.backup.folder&&NATIVE&&NATIVE.pickBackupFolder)NATIVE.pickBackupFolder();
    render();return;}
  if(el.id==='fileCsv'||el.id==='fileBackup'){const file=el.files[0];if(!file)return;const r=new FileReader();
    r.onload=()=>{if(el.id==='fileCsv'){const res=importCSV(String(r.result));toast(res.err?res.err:`Imported ${res.n} measurement${res.n===1?'':'s'}${res.skip?`, skipped ${res.skip}`:''}`);}
      else{try{const d=JSON.parse(r.result);if(d.users&&d.ms)S=fill(d);else if(d.profiles&&d.measurements)S=fill(migrate(d));else throw 0;save();setTheme();toast('Backup restored');}catch(_){toast('That file is not a VScale Offline backup');}}
      render();};r.readAsText(file);el.value='';}
});

load();setTheme();render();setStatus('off','Not connected');syncReminder();
if(!NATIVE)try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!IN_PREVIEW)navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
window.__test={S:()=>S,compute,toCSV,toTXT,importCSV,parseFrame,evaluate,go};
})();
