name: Build TapPay APK
on:
  push:
    branches: [main]
    paths: ['payments/app/**', '.github/workflows/payments.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: payments/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        run: |
          msg=$( (grep -nE "^e: |^w: .*error|error:|What went wrong|Could not|Caused by|FAILURE|^> [^T]" build.log || tail -n 40 build.log) | head -n 45 | cut -c1-300 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build log::${msg}"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ../../TapPay-${{ github.run_number }}.apk
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tappay-${{ github.run_number }}
          name: TapPay build ${{ github.run_number }}
          files: TapPay-*.apk
