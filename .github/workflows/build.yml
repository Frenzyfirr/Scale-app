name: Build APK
on:
  push:
    branches: [main]
    # Only the scale app's own files start a scale build; other apps in this repo never do.
    paths: ['app/**', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        run: |
          msg=$( (grep -nE "^e: |^w: .*error|error:|What went wrong|Could not|Caused by|FAILURE|^> [^T]" build.log || tail -n 40 build.log) | head -n 45 | cut -c1-300 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build log::${msg}"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk VScaleOffline-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VScaleOffline-apk
          path: VScaleOffline-*.apk
      - name: Publish as a release (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VScale Offline build ${{ github.run_number }}
          files: VScaleOffline-*.apk
