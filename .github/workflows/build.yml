name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk VScaleOffline-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VScaleOffline-apk
          path: VScaleOffline-*.apk
      - name: Publish as a release (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VScale Offline build ${{ github.run_number }}
          files: VScaleOffline-*.apk
