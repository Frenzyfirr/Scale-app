name: Build Scribe APK
on:
  push:
    branches: [main]
    paths: ['transcribe/**', '.github/workflows/scribe.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: transcribe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Fetch Vosk offline models
        run: |
          set -e
          dl() {
            url="$1"; dir="$2"; tmp=$(mktemp -d)
            echo "Downloading $url"
            curl -fL --retry 3 -o "$tmp/m.zip" "$url"
            unzip -q "$tmp/m.zip" -d "$tmp"
            sub=$(find "$tmp" -maxdepth 1 -mindepth 1 -type d | head -1)
            mkdir -p "app/src/main/assets/$dir"
            cp -r "$sub"/* "app/src/main/assets/$dir/"
            rm -rf "$tmp"
          }
          dl https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip model-en
          dl https://alphacephei.com/vosk/models/vosk-model-small-pl-0.22.zip model-pl
          dl https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip model-es
          du -sh app/src/main/assets/model-* || true
      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        run: |
          msg=$( (grep -nE "^e: |^w: .*error|error:|What went wrong|Could not|Caused by|FAILURE|^> [^T]" build.log || tail -n 40 build.log) | head -n 45 | cut -c1-300 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build log::${msg}"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ../Scribe-${{ github.run_number }}.apk
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scribe-${{ github.run_number }}
          name: Scribe build ${{ github.run_number }}
          files: Scribe-*.apk
