name: Build Scribe APK
on:
  push:
    branches: [main]
    paths: ['transcribe/**', '.github/workflows/scribe.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: transcribe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Fetch whisper.cpp source and model
        run: |
          set -e
          git clone --depth 1 --branch v1.5.4 https://github.com/ggerganov/whisper.cpp app/src/main/cpp/whisper
          echo "whisper.cpp files:"; ls app/src/main/cpp/whisper/ggml.c app/src/main/cpp/whisper/whisper.cpp
          mkdir -p app/src/main/assets/whisper
          curl -fL --retry 3 -o app/src/main/assets/whisper/ggml-base.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
          ls -la app/src/main/assets/whisper/
      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Show build errors
        if: failure()
        run: |
          msg=$( (grep -nE "^e: |^w: .*error|error:|What went wrong|Could not|Caused by|FAILURE|^> [^T]" build.log || tail -n 40 build.log) | head -n 45 | cut -c1-300 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build log::${msg}"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ../Scribe-${{ github.run_number }}.apk
      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scribe-${{ github.run_number }}
          name: Scribe build ${{ github.run_number }}
          files: Scribe-*.apk
